# worker-service-account.yaml
#
# Least-privilege Kubernetes ServiceAccount for SFDC Integrator worker pods.
#
# This service account is DISTINCT from the API service account
# (sfdc-integrator-service) and grants only the permissions required for
# worker execution. Worker pods must not use the API service account.
#
# Usage:
#   Replace WORKER_NAMESPACE with the target namespace before applying:
#     sed 's/${WORKER_NAMESPACE}/sfdc-integrator-dev/g' k8s/worker-service-account.yaml \
#       | kubectl apply -n sfdc-integrator-dev -f -
#
#   Or use the rendered fixtures in k8s/fixtures/ for environment-specific values.
#
# automountServiceAccountToken: false prevents the API token from being
# automatically mounted in every pod. Pods that require it must opt in
# explicitly via spec.automountServiceAccountToken: true.
#
# Cloud-provider workload identity:
#   If cloud IAM workload identity is used (e.g. AWS IRSA, GKE Workload Identity),
#   add the provider-specific annotation to the annotations block below.
#   This annotation is optional and must not be present in environments that
#   do not use workload identity.
#   Example (AWS IRSA): eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/sfdc-worker-role
#   Example (GKE):      iam.gke.io/gcp-service-account: sfdc-worker@PROJECT.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sfdc-worker
  namespace: ${WORKER_NAMESPACE}
  labels:
    app: sfdc-integrator-service
    component: worker
    workload: release-worker
    managed-by: sfdc-deploy-scripts
  annotations:
    # Optional: cloud provider workload identity annotation.
    # Remove this block entirely if workload identity is not used.
    # cloud-provider/role-arn: "REPLACE_WITH_WORKER_IAM_ROLE_ARN_OR_REMOVE"
    description: "Least-privilege service account for SFDC worker pods — distinct from API service account"
automountServiceAccountToken: false
