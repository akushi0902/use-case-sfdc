// ============================================================
// Repository Policy:
//   Supported repositories: mavenCentral, gradlePluginPortal,
//   and the authenticated internal Opsera package manager.
//   JCenter is deprecated, has weak provenance guarantees, and
//   is NOT permitted. See README.md for hygiene checks.
// ============================================================

buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        // Internal Opsera package manager — required for Opsera build plugins.
        // Set OPSERA_REPO_URL, OPSERA_REPO_USER, and OPSERA_REPO_TOKEN in your
        // environment or CI secret store. Do NOT commit credentials.
        if (System.getenv('OPSERA_REPO_URL')) {
            maven {
                url System.getenv('OPSERA_REPO_URL')
                credentials {
                    username = System.getenv('OPSERA_REPO_USER') ?: ''
                    password = System.getenv('OPSERA_REPO_TOKEN') ?: ''
                }
            }
        }
    }
    dependencies {
        classpath 'org.springframework.boot:spring-boot-gradle-plugin:3.4.1'
        classpath 'io.spring.gradle:dependency-management-plugin:1.1.7'
    }
}

plugins {
    id 'java'
}

apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

group = 'com.opsera.integrator'
version = '0.0.1-SNAPSHOT'

// Java 21 toolchain — enforces consistent compilation and test execution across
// developer workstations, CI workers, and release builds regardless of host JVM.
// Gradle provisions the JDK automatically if JAVA_HOME does not point to Java 21.
// Java 25 is a future certification target only — do NOT change this to 25.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // Explicit compatibility settings ensure plugins that inspect these values
    // (e.g. SonarQube, PMD, Checkstyle) agree with the toolchain baseline.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// ============================================================
// Artifact Repositories
// Supported: mavenCentral, gradlePluginPortal (plugins only),
//            internal Opsera package manager (authenticated).
// NOT permitted: jcenter, bintray, or any deprecated external
//               repository. See README.md for hygiene checks.
// ============================================================
repositories {
    mavenCentral()
    // Internal Opsera package manager — required for Opsera libraries.
    // Set OPSERA_REPO_URL, OPSERA_REPO_USER, and OPSERA_REPO_TOKEN in your
    // environment or CI secret store. Do NOT commit credentials.
    if (System.getenv('OPSERA_REPO_URL')) {
        maven {
            url System.getenv('OPSERA_REPO_URL')
            credentials {
                username = System.getenv('OPSERA_REPO_USER') ?: ''
                password = System.getenv('OPSERA_REPO_TOKEN') ?: ''
            }
        }
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.4.1'
    }
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // JDBC datasource support — provides HikariCP connection pool and DataSource autoconfiguration
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // Spring Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // Hazelcast
    implementation 'com.hazelcast:hazelcast-spring'

    // PostgreSQL JDBC driver — runtime only; production datasource target
    runtimeOnly 'org.postgresql:postgresql'

    // Flyway schema migration framework (Spring Boot BOM manages version — 10.x for Spring Boot 3.4.1)
    implementation 'org.flywaydb:flyway-core'
    // Flyway 10 requires a separate artifact for each database vendor
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Salesforce / Opsera internal libraries (resolved from internal package manager)
    // These coordinates must be available in OPSERA_REPO_URL.
    // If resolution fails, mirror the artifact to the internal repository or
    // replace it with an approved alternative — do NOT restore JCenter.
    // implementation 'com.opsera.salesforce:opsera-sf-library:<version>'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    // H2 in-memory database for isolated test datasource (PostgreSQL compatibility mode)
    testRuntimeOnly 'com.h2database:h2'
}

test {
    useJUnitPlatform()
}

// ============================================================
// Repository Hygiene Verification
//
// Run this task to detect accidental JCenter reintroduction:
//   ./gradlew checkNoJCenter
//
// This task fails the build if jcenter() or any JCenter URL
// appears in buildscript or project repository declarations.
// Add this to CI gating steps to prevent regression.
// ============================================================
tasks.register('checkNoJCenter') {
    group = 'Verification'
    description = 'Fails the build if JCenter is declared in any Gradle repository block. ' +
            'Run: ./gradlew checkNoJCenter'

    doLast {
        def buildFiles = fileTree(rootDir) {
            include '**/*.gradle', '**/*.gradle.kts'
            exclude '**/build/**'
        }

        def jcenterPattern = ~/(?i)(jcenter\(\)|https?:\/\/jcenter\.bintray\.com)/
        def violations = []

        buildFiles.each { file ->
            file.readLines().eachWithIndex { line, idx ->
                // Skip comment lines and string literals in task/pattern definitions
                def stripped = line.trim()
                if (stripped.startsWith('//') || stripped.startsWith('*') || stripped.startsWith('/*')) {
                    return
                }
                if (line =~ jcenterPattern) {
                    violations << "${file.path}:${idx + 1}: ${line.trim()}"
                }
            }
        }

        if (violations) {
            throw new GradleException(
                "Repository hygiene violation: JCenter is declared in the following location(s).\n" +
                "JCenter is deprecated with weak availability and provenance guarantees.\n" +
                "Mirror or replace any missing artifact in an approved repository instead of\n" +
                "restoring JCenter access.\n\nViolations:\n" +
                violations.join('\n')
            )
        } else {
            logger.lifecycle("checkNoJCenter PASSED — no JCenter declarations found.")
        }
    }
}

// Wire hygiene check into the standard check lifecycle
check.dependsOn checkNoJCenter

// ============================================================
// Java Toolchain Baseline Verification
//
// Run this task to confirm the build is targeting Java 21:
//   ./gradlew checkJavaToolchain
//
// Fails if sourceCompatibility or targetCompatibility deviate
// from Java 21. Wired into the check lifecycle.
// ============================================================
tasks.register('checkJavaToolchain') {
    group = 'Verification'
    description = 'Fails the build if Java sourceCompatibility or targetCompatibility ' +
            'are not set to Java 21. Run: ./gradlew checkJavaToolchain'

    doLast {
        def expected = JavaVersion.VERSION_21
        if (project.java.sourceCompatibility != expected) {
            throw new GradleException(
                "Java toolchain baseline violation: sourceCompatibility is " +
                "'${project.java.sourceCompatibility}' but must be '${expected}'.\n" +
                "Update build.gradle java { sourceCompatibility = JavaVersion.VERSION_21 }."
            )
        }
        if (project.java.targetCompatibility != expected) {
            throw new GradleException(
                "Java toolchain baseline violation: targetCompatibility is " +
                "'${project.java.targetCompatibility}' but must be '${expected}'.\n" +
                "Update build.gradle java { targetCompatibility = JavaVersion.VERSION_21 }."
            )
        }
        logger.lifecycle("checkJavaToolchain PASSED — sourceCompatibility and targetCompatibility are Java 21.")
    }
}

check.dependsOn checkJavaToolchain

// ============================================================
// NPM Artifact Policy Guard
//
// Organization policy: this is a Java/Gradle service. NPM
// package manager artifacts are PROHIBITED in commits.
//
// Run this task to verify no prohibited NPM files are present:
//   ./gradlew checkNoNpmArtifacts
//
// Prohibited patterns:
//   package.json, package-lock.json, npm-shrinkwrap.json,
//   yarn.lock, pnpm-lock.yaml, node_modules/
//
// Fails the build and lists offending paths if any are found.
// Wired into the check lifecycle — runs on every release build.
//
// See also: scripts/check-no-npm-artifacts.sh (CI-friendly
// standalone variant that does not require Gradle).
// ============================================================
tasks.register('checkNoNpmArtifacts') {
    group = 'Verification'
    description = 'Fails the build if prohibited NPM artifacts are present in tracked source paths. ' +
            'Run: ./gradlew checkNoNpmArtifacts'

    doLast {
        def prohibitedFiles = [
            'package.json', 'package-lock.json', 'npm-shrinkwrap.json',
            'yarn.lock', 'pnpm-lock.yaml'
        ]
        def violations = []

        // Scan for prohibited file names; exclude generated and VCS paths.
        // node_modules directories are handled separately below.
        def scanTree = fileTree(rootDir) {
            include prohibitedFiles.collect { "**/${it}" as String }
            exclude '**/build/**'
            exclude '**/.gradle/**'
            exclude '**/.git/**'
            exclude '**/node_modules/**'
        }
        scanTree.each { f -> violations << f.absolutePath }

        // Recursively find node_modules directories, skipping build outputs.
        // Defined as a closure so it can recurse without Gradle upfront evaluation.
        def findNodeModules
        findNodeModules = { File dir ->
            if (!dir.isDirectory()) return
            def relPath = rootDir.toPath().relativize(dir.toPath()).toString()
            if (dir.name == 'node_modules') {
                violations << dir.absolutePath
                return
            }
            // Skip directories that are build outputs or VCS internals
            if (dir.name == 'build' || dir.name == '.gradle' || dir.name == '.git') return
            dir.listFiles()?.each { child ->
                if (child.isDirectory()) findNodeModules(child)
            }
        }
        findNodeModules(rootDir)

        if (violations) {
            throw new GradleException(
                "NPM artifact policy violation: Prohibited NPM package manager files or " +
                "directories were found in this Java/Gradle service repository.\n\n" +
                "Offending paths:\n" +
                violations.collect { "  ${it}" }.join('\n') + "\n\n" +
                "Action required: Remove these files from the repository.\n" +
                "This service uses Gradle and Java only. Do not add package.json,\n" +
                "package-lock.json, npm-shrinkwrap.json, yarn.lock, pnpm-lock.yaml,\n" +
                "or node_modules/ to commits. See README.md for contribution policy."
            )
        } else {
            logger.lifecycle("checkNoNpmArtifacts PASSED — no prohibited NPM artifacts found.")
        }
    }
}

check.dependsOn checkNoNpmArtifacts

// ============================================================
// NPM Artifact Guard Self-Test
//
// Verifies the guard detects prohibited files (failing state)
// and passes on a clean directory (passing state).
//
// Run:  ./gradlew verifyNpmArtifactGuard
//
// Uses temporary directories under build/ which are excluded
// from the main guard scan — no real NPM files are committed.
// ============================================================
tasks.register('verifyNpmArtifactGuard') {
    group = 'Verification'
    description = 'Self-test: verifies the NPM artifact guard correctly detects prohibited files ' +
            'and passes on clean state. Run: ./gradlew verifyNpmArtifactGuard'

    doLast {
        def prohibitedFiles = [
            'package.json', 'package-lock.json', 'npm-shrinkwrap.json',
            'yarn.lock', 'pnpm-lock.yaml'
        ]

        // ---- Test 1: clean directory must produce zero violations ----
        def cleanDir = file("${buildDir}/npm-guard-test/clean")
        cleanDir.mkdirs()
        def cleanViolations = prohibitedFiles.findAll { name ->
            new File(cleanDir, name).exists()
        }
        if (!cleanViolations.isEmpty()) {
            throw new GradleException(
                "verifyNpmArtifactGuard FAIL: clean directory unexpectedly contains prohibited files: " +
                "${cleanViolations}. This is a guard implementation bug."
            )
        }

        // ---- Test 2: each prohibited file name must be detected ----
        def dirtyDir = file("${buildDir}/npm-guard-test/dirty")
        dirtyDir.mkdirs()
        def detectionFailures = []
        prohibitedFiles.each { name ->
            def f = new File(dirtyDir, name)
            // Write minimal safe placeholder — no real NPM dependency declarations
            f.text = "# Test fixture — not a real NPM artifact. Remove if present outside build/.\n"
            if (!f.exists() || !prohibitedFiles.contains(f.name)) {
                detectionFailures << name
            }
        }
        if (!detectionFailures.isEmpty()) {
            throw new GradleException(
                "verifyNpmArtifactGuard FAIL: guard did not detect these file names: " +
                "${detectionFailures}"
            )
        }

        // ---- Test 3: node_modules directory must be detected ----
        def nodeModDir = new File(dirtyDir, 'node_modules')
        nodeModDir.mkdir()
        if (!nodeModDir.exists() || nodeModDir.name != 'node_modules') {
            throw new GradleException(
                "verifyNpmArtifactGuard FAIL: node_modules directory was not created/detectable."
            )
        }

        logger.lifecycle("verifyNpmArtifactGuard PASSED — guard correctly detects all prohibited " +
                "patterns and passes on clean state.")
    }
}

check.dependsOn verifyNpmArtifactGuard

// ============================================================
// Kubernetes Deployment Script Validation
//
// Run this task to validate all Kubernetes deployment scripts:
//   ./gradlew validateDeployScripts
//
// Performs bash syntax checks and dry-run execution of each
// deploy script (dev-k8.sh, test-k8.sh, prod-k8.sh) using
// committed placeholder fixture values. No cluster contact.
// Wired into the check lifecycle.
// ============================================================
tasks.register('validateDeployScripts') {
    group = 'Verification'
    description = 'Validates Kubernetes deployment scripts with syntax checks and dry-run execution. ' +
            'Run: ./gradlew validateDeployScripts'

    doLast {
        def validationScript = new File(rootDir, 'scripts/validate-deploy-scripts.sh')
        if (!validationScript.exists()) {
            throw new GradleException(
                "validateDeployScripts: validation script not found at ${validationScript.path}.\n" +
                "Ensure scripts/validate-deploy-scripts.sh is committed."
            )
        }
        def result = exec {
            commandLine 'bash', validationScript.absolutePath
            workingDir rootDir
            ignoreExitValue = true
        }
        if (result.exitValue != 0) {
            throw new GradleException(
                "validateDeployScripts FAILED — one or more deployment script checks failed.\n" +
                "Run ./gradlew validateDeployScripts for detailed output."
            )
        }
        logger.lifecycle("validateDeployScripts PASSED — all deployment scripts passed syntax and dry-run checks.")
    }
}

check.dependsOn validateDeployScripts
