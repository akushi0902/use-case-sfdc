# Forge Shipping Scan Suppression Entries — SFDC Integrator Service
#
# This file contains time-bounded, owner-tracked suppressions for scan findings
# that are confirmed false positives or accepted risks.
#
# REQUIRED FIELDS for every entry:
#   id           — unique identifier for this suppression (never reuse IDs)
#   rule_id      — the scan rule ID, CVE, or CWE being suppressed
#   tool         — which scanner this applies to (gitleaks | semgrep | dependency_check | trivy)
#   owner        — GitHub team or user who is accountable for this exception
#   justification — specific, verifiable reason this suppression is safe (not "false positive")
#   expiry       — ISO 8601 date after which this suppression auto-expires and the gate fails
#
# Expired entries cause the gate to fail until the entry is renewed or removed.
# Renewals require re-verification of the justification and a new owner sign-off.
# Max suppression duration: 90 days (enforced by pipeline.yml suppression_policy).
#
# NEVER use suppressions to bypass critical secret findings or hardcoded credentials.
# If a rule fires on a synthetic test fixture, update the fixture instead of suppressing.

version: "1"
suppressions: []
