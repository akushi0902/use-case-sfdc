# Test profile configuration — overrides application.yaml for unit/integration tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  com.hazelcast.spring.boot.autoconfigure.HazelcastAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Disable the SFDC security filter chain in the test profile so @SpringBootTest contexts
# load without a live identity provider. @WebMvcTest slices that need security must
# explicitly @Import SecurityConfig and provide a JwtDecoder stub.
sfdc.security.enabled=false

# In-memory PostgreSQL-compatible datasource for the test profile.
# No real database required; H2 in PostgreSQL mode satisfies schema and type expectations.
spring.datasource.url=jdbc:h2:mem:sfdctest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway is disabled in the base test profile so that controller and filter tests start quickly.
# Migration integration tests re-enable it via @TestPropertySource(properties="spring.flyway.enabled=true").
spring.flyway.enabled=false
